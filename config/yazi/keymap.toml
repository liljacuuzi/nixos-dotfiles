[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = 'shell "ripdrag -a -x %s" --orphan'
desc = "Drag selected files into other applications"
# Paste files from system clipboard into current directory
[[mgr.prepend_keymap]]
on   = [ "p" ]
run  = [ 'plugin clipboard -- --action=paste' ]
desc = "Paste from system clipboard"

# Jump to USB drive mount point
[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "cd /run/media/smalldog"
desc = "Go to USB drive (/run/media/smalldog)"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd /run/media/smalldog"
desc = "Go to media (/run/media/smalldog)"

