; Generated by pywal16 for SilentSDDM
[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "wal.png"
use-background-color = false
background-color = "{color0}"
blur = 16
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 70
font-weight = 900
color = "{color7}"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-weight = 600
color = "{color4}"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "{color7}"
paint-icon = true
spacing = 0

[LoginScreen]
background = "wal.png"
use-background-color = false
background-color = "{color0}"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 2
inactive-border-size = 0
active-border-color = "{color4}"
inactive-border-color = "{color8}"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "{color7}"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 220
height = 36
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 13
icon = "password.svg"
icon-size = 16
content-color = "{color7}"
background-color = "{color0}"
background-opacity = 0.75
border-size = 1
border-color = "{color4}"
border-radius-left = 8
border-radius-right = 8
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "{color4}"
background-opacity = 0.85
active-background-color = "{color6}"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "{color0}"
active-content-color = "{color0}"
border-size = 0
border-color = "{color4}"
border-radius-left = 8
border-radius-right = 8
margin-left = 6
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "{color4}"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 11
font-weight = 400
normal-color = "{color7}"
warning-color = "{color3}"
error-color = "{color1}"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 32
border-radius = 6
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 6
display-scrollbar = true
margin = 6
background-color = "{color0}"
background-opacity = 0.90
active-option-background-color = "{color4}"
active-option-background-opacity = 0.40
content-color = "{color7}"
active-content-color = "{color7}"
font-family = "JetBrainsMono Nerd Font"
border-size = 1
border-color = "{color8}"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "{color0}"
background-opacity = 0.60
active-background-opacity = 0.85
content-color = "{color7}"
active-content-color = "{color7}"
border-size = 1
border-color = "{color8}"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "{color0}"
background-opacity = 0.60
active-background-opacity = 0.85
content-color = "{color7}"
active-content-color = "{color7}"
border-size = 1
border-color = "{color8}"
font-size = 11
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "{color0}"
background-opacity = 0.60
active-background-opacity = 0.85
content-color = "{color7}"
active-content-color = "{color7}"
border-size = 1
border-color = "{color8}"
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 110
background-color = "{color0}"
background-opacity = 0.60
active-background-opacity = 0.85
content-color = "{color7}"
active-content-color = "{color7}"
border-size = 1
border-color = "{color8}"
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "{color0}"
background-opacity = 0.85
key-content-color = "{color7}"
key-color = "{color0}"
key-opacity = 0.50
key-active-background-color = "{color4}"
key-active-opacity = 0.80
selection-background-color = "{color4}"
selection-content-color = "{color0}"
primary-color = "{color4}"
border-size = 1
border-color = "{color8}"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "{color7}"
background-color = "{color0}"
background-opacity = 0.85
border-radius = 5
disable-user = false
disable-login-button = false
