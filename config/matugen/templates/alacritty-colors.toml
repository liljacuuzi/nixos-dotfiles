# Matugen Material You colors for Alacritty (matching st Material You + blended ANSI palette)

[colors.primary]
background = "{{ colors.surface.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"

[colors.cursor]
text = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.primary.default.hex }}"

[colors.vi_mode_cursor]
text = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.tertiary.default.hex }}"

[colors.search.matches]
foreground = "{{ colors.on_tertiary.default.hex }}"
background = "{{ colors.tertiary.default.hex }}"

[colors.search.focused_match]
foreground = "{{ colors.on_primary.default.hex }}"
background = "{{ colors.primary.default.hex }}"

[colors.footer_bar]
foreground = "{{ colors.on_surface.default.hex }}"
background = "{{ colors.surface_container_high.default.hex }}"

[colors.hints.start]
foreground = "{{ colors.on_secondary.default.hex }}"
background = "{{ colors.secondary.default.hex }}"

[colors.hints.end]
foreground = "{{ colors.on_secondary_container.default.hex }}"
background = "{{ colors.secondary_container.default.hex }}"

[colors.selection]
text = "{{ colors.on_primary.default.hex }}"
background = "{{ colors.primary.default.hex }}"

[colors.normal]
black   = "{{ colors.surface.default.hex }}"
red     = "{{ colors.red.default.hex | auto_lightness: 15 }}"
green   = "{{ colors.green.default.hex | auto_lightness: 15 }}"
yellow  = "{{ colors.yellow.default.hex | auto_lightness: 15 }}"
blue    = "{{ colors.blue.default.hex | auto_lightness: 15 }}"
magenta = "{{ colors.magenta.default.hex | auto_lightness: 15 }}"
cyan    = "{{ colors.cyan.default.hex | auto_lightness: 15 }}"
white   = "{{ colors.on_surface_variant.default.hex }}"

[colors.bright]
black   = "{{ colors.outline.default.hex }}"
red     = "{{ colors.red.default.hex | auto_lightness: 5 }}"
green   = "{{ colors.green.default.hex | auto_lightness: 5 }}"
yellow  = "{{ colors.yellow.default.hex | auto_lightness: 5 }}"
blue    = "{{ colors.blue.default.hex | auto_lightness: 5 }}"
magenta = "{{ colors.magenta.default.hex | auto_lightness: 5 }}"
cyan    = "{{ colors.cyan.default.hex | auto_lightness: 5 }}"
white   = "{{ colors.on_surface.default.hex }}"

[colors.dim]
black   = "{{ colors.surface_container_high.default.hex }}"
red     = "{{ colors.red.default.hex | auto_lightness: 25 }}"
green   = "{{ colors.green.default.hex | auto_lightness: 25 }}"
yellow  = "{{ colors.yellow.default.hex | auto_lightness: 25 }}"
blue    = "{{ colors.blue.default.hex | auto_lightness: 25 }}"
magenta = "{{ colors.magenta.default.hex | auto_lightness: 25 }}"
cyan    = "{{ colors.cyan.default.hex | auto_lightness: 25 }}"
white   = "{{ colors.on_surface_variant.default.hex }}"
