# Matugen Material You theme for Yazi (v26.x schema, adapted from InioX/matugen-themes)

[app]
overall = {}

[mgr]
cwd = { fg = "{{ colors.primary.default.hex }}" }
syntect_theme = "~/.cache/matugen/bat.tmTheme"

# Find
find_keyword  = { fg = "{{ colors.error.default.hex }}", bold = true, italic = true, underline = true }
find_position = { fg = "{{ colors.tertiary.default.hex }}", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied   = { fg = "{{ colors.green.default.hex | auto_lightness: 10 }}", bg = "{{ colors.green.default.hex | auto_lightness: 10 }}" }
marker_cut      = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
marker_marked   = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
marker_selected = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
marker_symbol   = "│"

# Count
count_copied   = { fg = "{{ colors.surface.default.hex }}", bg = "{{ colors.green.default.hex | auto_lightness: 10 }}" }
count_cut      = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
count_selected = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{ colors.outline_variant.default.hex }}" }

[tabs]
active   = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { bg = "{{ colors.primary.default.hex }}", fg = "{{ colors.on_primary.default.hex }}", bold = true }
normal_alt  = { bg = "{{ colors.surface_container_high.default.hex }}", fg = "{{ colors.on_surface_variant.default.hex }}" }

select_main = { bg = "{{ colors.secondary.default.hex }}", fg = "{{ colors.on_secondary.default.hex }}", bold = true }
select_alt  = { bg = "{{ colors.surface_container_high.default.hex }}", fg = "{{ colors.on_surface_variant.default.hex }}" }

unset_main  = { bg = "{{ colors.tertiary.default.hex }}", fg = "{{ colors.on_tertiary.default.hex }}", bold = true }
unset_alt   = { bg = "{{ colors.surface_container_high.default.hex }}", fg = "{{ colors.on_surface_variant.default.hex }}" }

[indicator]
parent  = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
current = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "{{ colors.outline.default.hex }}" }
perm_type  = { fg = "{{ colors.green.default.hex | auto_lightness: 10 }}" }
perm_read  = { fg = "{{ colors.yellow.default.hex | auto_lightness: 10 }}" }
perm_write = { fg = "{{ colors.red.default.hex | auto_lightness: 10 }}" }
perm_exec  = { fg = "{{ colors.cyan.default.hex | auto_lightness: 10 }}" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
progress_error  = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }

[which]
cols            = 3
border          = { fg = "{{ colors.primary.default.hex }}" }
mask            = { bg = "{{ colors.surface_container_lowest.default.hex }}" }
cand            = { fg = "{{ colors.primary.default.hex }}" }
rest            = { fg = "{{ colors.outline.default.hex }}" }
desc            = { fg = "{{ colors.on_surface.default.hex }}" }
separator       = "  "
separator_style = { fg = "{{ colors.outline_variant.default.hex }}" }

[confirm]
border  = { fg = "{{ colors.primary.default.hex }}" }
title   = { fg = "{{ colors.primary.default.hex }}" }
btn_yes = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
btn_no  = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[spot]
border   = { fg = "{{ colors.primary.default.hex }}" }
title    = { fg = "{{ colors.primary.default.hex }}" }
tbl_col  = { fg = "{{ colors.primary.default.hex }}" }
tbl_cell = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }

[notify]
title_info  = { fg = "{{ colors.primary.default.hex }}" }
title_warn  = { fg = "{{ colors.tertiary.default.hex }}" }
title_error = { fg = "{{ colors.error.default.hex }}" }

[pick]
border   = { fg = "{{ colors.primary.default.hex }}" }
active   = { fg = "{{ colors.tertiary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[input]
border   = { fg = "{{ colors.primary.default.hex }}" }
title    = { fg = "{{ colors.primary.default.hex }}" }
value    = { fg = "{{ colors.on_surface.default.hex }}" }
selected = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }

[cmp]
border   = { fg = "{{ colors.primary.default.hex }}" }
active   = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}" }

[tasks]
border  = { fg = "{{ colors.primary.default.hex }}" }
title   = { fg = "{{ colors.primary.default.hex }}" }
hovered = { fg = "{{ colors.tertiary.default.hex }}", bold = true }

[help]
border  = { fg = "{{ colors.primary.default.hex }}" }
chord   = { fg = "{{ colors.primary.default.hex }}" }
action  = { fg = "{{ colors.on_surface_variant.default.hex }}" }
hovered = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }

[filetype]
rules = [
    { mime = "**/image/*", fg = "{{ colors.tertiary.default.hex }}" },
    { mime = "**/{audio,video}/*", fg = "{{ colors.secondary.default.hex }}" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{ colors.error.default.hex }}" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "{{ colors.primary_fixed_dim.default.hex }}" },
    { mime = "vfs/{absent,stale}", fg = "{{ colors.outline.default.hex }}" },
    { url = "*", is = "orphan", fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" },
    { url = "*", is = "exec",   fg = "{{ colors.green.default.hex | auto_lightness: 10 }}" },
    { url = "*", is = "dummy",  fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" },
    { url = "*/", is = "dummy", fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" },
    { url = "*/", fg = "{{ colors.primary.default.hex }}" },
]

[icon]
conds = [
    { if = "orphan", text = "", fg = "{{ colors.error.default.hex }}" },
    { if = "link", text = "", fg = "{{ colors.outline.default.hex }}" },
    { if = "block", text = "", fg = "{{ colors.tertiary.default.hex }}" },
    { if = "char", text = "", fg = "{{ colors.tertiary.default.hex }}" },
    { if = "fifo", text = "", fg = "{{ colors.tertiary.default.hex }}" },
    { if = "sock", text = "", fg = "{{ colors.tertiary.default.hex }}" },
    { if = "sticky", text = "", fg = "{{ colors.tertiary.default.hex }}" },
    { if = "dummy", text = "", fg = "{{ colors.error.default.hex }}" },

    { if = "dir & hovered", text = "", fg = "{{ colors.primary.default.hex }}" },
    { if = "dir", text = "", fg = "{{ colors.primary.default.hex }}" },
    { if = "exec", text = "", fg = "{{ colors.green.default.hex | auto_lightness: 10 }}" },
    { if = "!dir", text = "", fg = "{{ colors.on_surface_variant.default.hex }}" },
]
