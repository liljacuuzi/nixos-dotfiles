[[mgr.prepend_keymap]]
on   = [ "<C-n>" ]
run  = 'shell "ripdrag -a -x %s" --orphan'
desc = "Drag selected files into other applications"
# Paste files from system clipboard into current directory
[[mgr.prepend_keymap]]
on   = [ "p" ]
run  = [ 'plugin clipboard -- --action=paste' ]
desc = "Paste from system clipboard"

# Jump to USB drive mount point
[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "cd /run/media/smalldog"
desc = "Go to USB drive (/run/media/smalldog)"

# Run themeswitch on the selected file
[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = 'shell "$HOME/nixos-dotfiles/scripts/theme-switch.sh %s" --orphan'
desc = "Run themeswitch on selected file"

# Jump to wallpapers directory
[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd ~/nixos-dotfiles/walls"
desc = "Go to wallpapers (~/nixos-dotfiles/walls)"
